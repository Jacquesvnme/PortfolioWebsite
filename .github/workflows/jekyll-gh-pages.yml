name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Adjust to your .NET version

      - name: Restore dependencies
        run: dotnet restore PortfolioWebsite.csproj

      - name: Build
        run: dotnet build PortfolioWebsite.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish PortfolioWebsite.csproj --configuration Release --no-build -o ./publish

      - name: Create blazor.webassembly.js alias
        run: |
          FILE=$(find publish/wwwroot/_framework -maxdepth 1 -type f -name 'blazor.webassembly.*.js' ! -name '*.br' ! -name '*.gz' | head -n 1)
          cp "$FILE" publish/wwwroot/_framework/blazor.webassembly.js

      - name: Ensure .nojekyll exists
        run: |
          mkdir -p publish/wwwroot
          touch publish/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './publish/wwwroot'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5