name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  # Triggers the script whenever you push to main

# Set permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x' # Change to '9.0.x' if using .NET 9

    # Compiles the MudBlazor project down into optimized client assets
    - name: Publish Blazor App
      run: dotnet publish -c Release -o release

    # Fixes the base path depending on your repository layout
    - name: Rewrite base href
      uses: SteveSandersonMS/ghaction-rewrite-base-href@v1
      with:
        html_path: release/wwwroot/index.html
        # If hosting at username.github.io/RepositoryName, change base_href to '/RepositoryName/'
        # If using a custom root domain or username.github.io, keep it as '/'
        base_href: '/' 

    # Solves SPA page refreshing by copying index.html to 404.html
    - name: Create 404 Fallback Route
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Configure Pages Setup
      uses: actions/configure-pages@v5

    - name: Upload Build Output
      uses: actions/upload-pages-artifact@v3
      with:
        path: release/wwwroot

    - name: Deploy Live to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4